name: Release Flow Action
description: Open a deploy pull request from staging and publish a semver release on main, driven by pull request changelog entries.
author: potatowski
branding:
  icon: tag
  color: blue

inputs:
  github_token:
    description: Token used for GitHub API calls. Leave empty to use the Changelog Release Flow app through OIDC (requires `id-token: write`). When set, use a GitHub App token so the deploy pull request triggers CI.
    required: false
    default: ''
  token_broker_url:
    description: Token broker endpoint used when github_token is empty.
    required: false
    default: https://release-flow-broker.vitorrocha.workers.dev/token
  staging_branch:
    description: Staging branch name.
    required: false
    default: dev
  main_branch:
    description: Production branch name.
    required: false
    default: main
  phase:
    description: Force a phase (prepare or finalize). Auto-detected from the pushed branch when empty.
    required: false
    default: ''
  update_major_tag:
    description: When 'true', move the major tag (for example v1) to the released commit.
    required: false
    default: 'false'

  since:
    description: Tag or commit SHA used as the start of the first release range when no vX.Y.Z tag exists yet. When empty, the whole history is scanned (up to 2000 commits).
    required: false
    default: ''

outputs:
  next_version:
    description: Version computed for the release (for example v1.4.0). Empty when there is nothing to release.
  release_body:
    description: Rendered deploy pull request body (prepare) or release notes (finalize).

runs:
  using: node24
  main: dist/index.cjs
