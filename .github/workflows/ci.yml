name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate action.yml
        run: npx --yes js-yaml@4.1.0 action.yml > /dev/null

      - run: npm test

      - run: npm run build

      - name: Check dist is up to date
        run: git diff --exit-code dist/

  broker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: broker/package-lock.json

      - run: npm ci

      - run: npm test
